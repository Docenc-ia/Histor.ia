    <script>
      (function() {
        // Prevent browser extension conflicts (e.g. Zerion / Web3 wallet redefinition errors)
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(target, prop, descriptor) {
            if (descriptor && typeof descriptor === 'object' && descriptor.configurable === false) {
              descriptor.configurable = true;
            }
            try {
              return origDefineProperty.call(this, target, prop, descriptor);
            } catch (err) {
              if (
                err instanceof TypeError &&
                (prop === 'isZerion' || (err.message && err.message.indexOf('Cannot redefine property') !== -1))
              ) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    target[prop] = descriptor.value;
                  }
                } catch (_) {}
                return target;
              }
              throw err;
            }
          };

          var origDefineProperties = Object.defineProperties;
          Object.defineProperties = function(target, props) {
            try {
              return origDefineProperties.call(this, target, props);
            } catch (err) {
              if (err instanceof TypeError && err.message && err.message.indexOf('Cannot redefine property') !== -1) {
                return target;
              }
              throw err;
            }
          };

          window.addEventListener('error', function(event) {
            if (
              event.message &&
              (event.message.indexOf('isZerion') !== -1 || event.message.indexOf('Cannot redefine property') !== -1)
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            if (
              event.reason &&
              event.reason.message &&
              (event.reason.message.indexOf('isZerion') !== -1 || event.reason.message.indexOf('Cannot redefine property') !== -1)
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        } catch (_) {}
      })();
    </script>
