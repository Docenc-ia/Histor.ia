    <script>
      (function() {
        // Prevent browser extension conflicts (e.g. Zerion / Web3 wallet redefinition errors)
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(target, prop, descriptor) {
            if (descriptor && typeof descriptor === 'object' && descriptor.configurable === false) {
              descriptor.configurable = true;
            }
            try {
              return origDefineProperty.call(this, target, prop, descriptor);
            } catch (err) {
              if (
                err instanceof TypeError &&
                (prop === 'isZerion' || (err.message && err.message.indexOf('Cannot redefine property') !== -1))
              ) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    target[prop] = descriptor.value;
                  }
                } catch (_) {}
                return target;
              }
              throw err;
            }
          };

          var origDefineProperties = Object.defineProperties;
          Object.defineProperties = function(target, props) {
            try {
              return origDefineProperties.call(this, target, props);
            } catch (err) {
              if (err instanceof TypeError && err.message && err.message.indexOf('Cannot redefine property') !== -1) {
                return target;
              }
              throw err;
            }
          };

          window.addEventListener('error', function(event) {
            if (
              event.message &&
              (event.message.indexOf('isZerion') !== -1 || event.message.indexOf('Cannot redefine property') !== -1)
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            if (
              event.reason &&
              event.reason.message &&
              (event.reason.message.indexOf('isZerion') !== -1 || event.reason.message.indexOf('Cannot redefine property') !== -1)
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        } catch (_) {}
      })();
    </script>

    <script>
      // Register Service Worker for PWA and warm static assets (CSS, JS, icons)
      if ('serviceWorker' in navigator && !window.location.hostname.includes('localhost') && window.location.protocol === 'https:') {
        window.addEventListener('load', function() {
          function warmStaticAssets(worker) {
            if (!worker) return;
            try {
              var elements = document.querySelectorAll('script[src], link[rel="stylesheet"][href], link[rel*="icon"][href]');
              var urls = [];
              for (var i = 0; i < elements.length; i++) {
                var el = elements[i];
                var rawUrl = el.getAttribute('src') || el.getAttribute('href');
                if (rawUrl && rawUrl.indexOf('/') === 0 && rawUrl.indexOf('//') !== 0 && rawUrl.indexOf('/src/') !== 0) {
                  urls.push(rawUrl);
                }
              }
              if (urls.length > 0) {
                worker.postMessage({ type: 'WARM_STATIC_ASSETS', urls: urls });
              }
            } catch (_) {}
          }

          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Docenc.IA PWA ServiceWorker registrado con éxito en scope:', reg.scope);
            warmStaticAssets(reg.active || navigator.serviceWorker.controller);
            navigator.serviceWorker.ready.then(function(readyReg) {
              warmStaticAssets(readyReg.active);
            });
          }).catch(function(err) {
            console.warn('Docenc.IA PWA ServiceWorker no se pudo registrar:', err);
          });
        });
      }
    </script>
